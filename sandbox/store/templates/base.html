<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Sandbox Shop{% endblock %} · Agent Hunt</title>
  <link rel="stylesheet" href="/static/shop.css" />
  <meta name="sandbox-session-id" content="{{ session_id }}" />
  <meta name="telemetry-url" content="{{ telemetry_url }}" />
  <meta name="sandbox-page" content="{{ page }}" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Sandbox Shop</a>
    <nav>
      <a href="/">Catalog</a>
      <a href="/cart">Cart ({{ cart_items|length }})</a>
      <a href="/checkout">Checkout</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Instrumented local sandbox for agent-hunt detection experiments. Not a real store.</p>
  </footer>
  <script src="/static/telemetry.js" defer></script>
</body>
</html>
