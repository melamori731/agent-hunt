[project]
name = "agent-hunt"
version = "0.1.0"
description = "Autonomous threat detection researcher for agentic commerce"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
  "agent_intelligence",
  "dataset_discovery",
  "dataset_validation",
  "detection_rule_specification",
  "independent_evaluator",
  "research_orchestrator",
  "sandbox_validation",
  "system_e2e",
  "tests",
]
